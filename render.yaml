# Render blueprint for Pictionary AI (lab/pictionary-ai): one web service that serves the game
# page and its API. The rest of this repository is the static portfolio on GitHub Pages.
# Deploy steps: lab/pictionary-ai/DEPLOY.md
services:
  - type: web
    name: pictionary-ai
    runtime: node
    plan: free
    rootDir: lab/pictionary-ai
    # Dev dependencies are needed to build the client (Vite), even with NODE_ENV=production.
    buildCommand: npm ci --include=dev && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    # Redeploy only when the game changes, not on every portfolio edit.
    buildFilter:
      paths:
        - lab/pictionary-ai/**
    envVars:
      - key: NODE_VERSION
        value: "22"
      - key: NODE_ENV
        value: production
      # Listen on all interfaces inside the container (Render routes traffic to it).
      - key: API_HOST
        value: 0.0.0.0
      # Render sits in front as a proxy: needed for per-player rate limits.
      - key: TRUST_PROXY
        value: "1"
      # Random secret generated by Render on the first deploy.
      - key: ROUND_SECRET
        generateValue: true
      # Your Anthropic API key: Render asks for it when you create the service.
      - key: ANTHROPIC_API_KEY
        sync: false
